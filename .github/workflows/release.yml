name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.97.1
      # packageManager pins pnpm; corepack activates that exact version.
      - run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          workspaces: core -> target
          shared-key: ubuntu-22.04-${{ runner.arch }}
          cache-bin: false
      # The canonical gate checks types before building and testing artifacts.
      - run: pnpm run test:release
      - name: Archive the tested Linux build
        run: tar -czf "${RUNNER_TEMP}/termina-tested-linux.tar.gz" dist-electron dist-renderer core/target/release/termina-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termina-tested-linux-${{ github.sha }}
          path: ${{ runner.temp }}/termina-tested-linux.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: mac-arm64
            core-asset: termina-core-darwin-arm64
          - os: ubuntu-22.04
            artifact: linux-x64
            core-asset: termina-core-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # The Vite renderer build needs more than the default runner heap.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        if: matrix.os == 'macos-15'
        with:
          toolchain: 1.97.1
      # packageManager pins pnpm; corepack activates that exact version.
      - run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        if: matrix.os == 'macos-15'
        with:
          workspaces: core -> target
          shared-key: ${{ matrix.os }}-${{ runner.arch }}
          cache-bin: false
      # Linux consumes the exact artifact validated by the test job in this run.
      # A tar archive preserves executable modes through artifact upload.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: termina-tested-linux-${{ github.sha }}
          path: ${{ runner.temp }}/termina-tested-linux
      - name: Restore the tested Linux build
        if: matrix.os == 'ubuntu-22.04'
        run: |
          tar -xzf "${RUNNER_TEMP}/termina-tested-linux/termina-tested-linux.tar.gz"
          test -x core/target/release/termina-core
          test -x dist-electron/termina-core
          test -s dist-renderer/index.html
      - name: Build macOS artifacts
        if: matrix.os == 'macos-15'
        run: pnpm run build
      # Stages the bundled node runtime and the core binary.
      - run: node --experimental-strip-types scripts/prepare-resources.ts
      - name: Run macOS release gate
        # macOS-only layer (package.json test:release-macos): the platform
        # spike plus the sandbox-live and built-Electron smoke gates,
        # before anything is packaged.
        if: matrix.os == 'macos-15'
        run: pnpm run test:release-macos
      - name: Package
        run: bash scripts/package-release.sh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage raw core binary
        run: |
          cp "core/target/release/termina-core" "release/${{ matrix.core-asset }}"
          test -s "release/${{ matrix.core-asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termina-release-${{ matrix.artifact }}
          if-no-files-found: error
          overwrite: true
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/termina-core-*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: termina-release-mac-arm64
          path: release-input/mac-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: termina-release-linux-x64
          path: release-input/linux-x64
      - name: Validate complete release asset set
        shell: bash
        run: |
          set -euo pipefail

          require_nonempty() {
            local root="$1"
            local pattern="$2"
            local label="$3"
            if ! find "$root" -maxdepth 1 -type f -name "$pattern" -size +0 -print -quit | grep -q .; then
              echo "Missing or empty release asset: $label ($root/$pattern)" >&2
              exit 1
            fi
          }

          mac="release-input/mac-arm64"
          linux="release-input/linux-x64"
          require_nonempty "$mac" "*.dmg" "macOS DMG"
          require_nonempty "$mac" "*.zip" "macOS ZIP"
          require_nonempty "$mac" "latest-mac.yml" "macOS update metadata"
          require_nonempty "$mac" "*.blockmap" "macOS update blockmap"
          require_nonempty "$mac" "termina-core-darwin-arm64" "macOS raw core"
          require_nonempty "$linux" "*.AppImage" "Linux AppImage"
          require_nonempty "$linux" "latest-linux.yml" "Linux update metadata"
          require_nonempty "$linux" "termina-core-linux-x64" "Linux raw core"

          duplicate_names="$(find "$mac" "$linux" -maxdepth 1 -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "Release asset names collide between workflow artifacts:" >&2
            echo "$duplicate_names" >&2
            exit 1
          fi

          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            cp -- "$asset" "release-assets/$(basename "$asset")"
          done < <(find "$mac" "$linux" -maxdepth 1 -type f -print0)
          find release-assets -maxdepth 1 -type f -size +0 -print
      - name: Create or reuse draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          read -r is_draft asset_count < <(gh release view "${GITHUB_REF_NAME}" --json isDraft,assets --jq '[.isDraft, (.assets | length)] | @tsv' 2>/dev/null || echo "")
          if [ -n "$is_draft" ]; then
            if [ "$is_draft" != "true" ] && [ "${asset_count:-0}" -gt 0 ]; then
              echo "Refusing to mutate an already-public release with existing assets: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Upload complete release asset set
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Make release public
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
