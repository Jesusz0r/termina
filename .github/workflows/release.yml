name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-arm64
            core-asset: termina-core-darwin-arm64
          - os: ubuntu-22.04
            artifact: linux-x64
            core-asset: termina-core-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # The Vite renderer build needs more than the default runner heap.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      # Builds the Rust core, main + preload, and the renderer.
      - run: npm run build
      # Stages the bundled node runtime and the core binary.
      - run: node scripts/prepare-resources.mjs
      - name: Package
        # Signs and notarizes when the Apple credentials exist as secrets;
        # otherwise the build stays unsigned. Retries once: the electron
        # download on fresh runners is flaky.
        run: |
          EXTRA=""
          # Notarizing an unsigned app fails; require the signing secret and
          # the team id too. The gate only applies to macOS packaging.
          if [ "$(uname -s)" = "Darwin" ] && [ -n "${CSC_LINK}" ] && [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            EXTRA="-c.mac.notarize=true"
          fi
          npx electron-builder $EXTRA ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }} || {
            sleep 15
            npx electron-builder $EXTRA ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: termina-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
      - name: Attach the raw core binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp "core/target/release/termina-core" "/tmp/${{ matrix.core-asset }}"
          gh release upload "${GITHUB_REF_NAME}" "/tmp/${{ matrix.core-asset }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
