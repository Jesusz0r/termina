name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.97.1
      - run: npm ci
      - run: npm run build
      - run: npm run test:release

  build:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: mac-arm64
            core-asset: termina-core-darwin-arm64
          - os: ubuntu-22.04
            artifact: linux-x64
            core-asset: termina-core-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # The Vite renderer build needs more than the default runner heap.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.97.1
      - run: npm ci
      - run: npx tsc --noEmit
      # Builds the Rust core, main + preload, and the renderer.
      - run: npm run build
      # Stages the bundled node runtime and the core binary.
      - run: node --experimental-strip-types scripts/prepare-resources.ts
      - name: Run macOS release gate
        if: matrix.os == 'macos-15'
        run: npm run test:release-macos
      - name: Package
        # Signs and notarizes when the Apple credentials exist as secrets;
        # otherwise the build stays unsigned. Retries once: the electron
        # download on fresh runners is flaky.
        run: |
          EXTRA=""
          # Notarizing an unsigned app fails; require the signing secret and
          # the team id too. The gate only applies to macOS packaging.
          if [ "$(uname -s)" = "Darwin" ] && [ -n "${CSC_LINK}" ] && [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            EXTRA="-c.mac.notarize=true"
          fi
          npx electron-builder $EXTRA --publish never || {
            echo "Packaging failed; retrying once"
            npx electron-builder $EXTRA --publish never
          }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage raw core binary
        run: |
          cp "core/target/release/termina-core" "release/${{ matrix.core-asset }}"
          test -s "release/${{ matrix.core-asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termina-release-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/termina-core-*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: termina-release-mac-arm64
          path: release-input/mac-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: termina-release-linux-x64
          path: release-input/linux-x64
      - name: Validate complete release asset set
        shell: bash
        run: |
          set -euo pipefail

          require_nonempty() {
            local root="$1"
            local pattern="$2"
            local label="$3"
            if ! find "$root" -maxdepth 1 -type f -name "$pattern" -size +0 -print -quit | grep -q .; then
              echo "Missing or empty release asset: $label ($root/$pattern)" >&2
              exit 1
            fi
          }

          mac="release-input/mac-arm64"
          linux="release-input/linux-x64"
          require_nonempty "$mac" "*.dmg" "macOS DMG"
          require_nonempty "$mac" "*.zip" "macOS ZIP"
          require_nonempty "$mac" "latest-mac.yml" "macOS update metadata"
          require_nonempty "$mac" "*.blockmap" "macOS update blockmap"
          require_nonempty "$mac" "termina-core-darwin-arm64" "macOS raw core"
          require_nonempty "$linux" "*.AppImage" "Linux AppImage"
          require_nonempty "$linux" "latest-linux.yml" "Linux update metadata"
          require_nonempty "$linux" "termina-core-linux-x64" "Linux raw core"

          duplicate_names="$(find "$mac" "$linux" -maxdepth 1 -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "Release asset names collide between workflow artifacts:" >&2
            echo "$duplicate_names" >&2
            exit 1
          fi

          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            cp -- "$asset" "release-assets/$(basename "$asset")"
          done < <(find "$mac" "$linux" -maxdepth 1 -type f -print0)
          find release-assets -maxdepth 1 -type f -size +0 -print
      - name: Create or reuse draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          existing_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ -n "$existing_draft" ]; then
            if [ "$existing_draft" != "true" ]; then
              echo "Refusing to mutate an already-public release: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Upload complete release asset set
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Make release public
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
