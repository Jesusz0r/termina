<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d2e"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fc1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS squircle background -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#bg)"/>
  <!-- top-left accent glow -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#glow)"/>
  <!-- subtle border -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="none" stroke="#3c3c3c" stroke-width="6"/>
  <!-- Tr monogram -->
  <text x="512" y="700" font-family="Menlo, Monaco, monospace" font-size="480" font-weight="700" fill="#4fc1ff" text-anchor="middle">Tr</text>
</svg>
