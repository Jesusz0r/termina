appId: dev.termina.app
productName: Termina
directories:
  output: release
files:
  - dist-electron/**/*
  # The core binary runs from extraResources, never from the archive. A
  # Mach-O inside app.asar is dead weight and cannot be spawned.
  - "!dist-electron/termina-core"
  - dist-renderer/**/*
# pi and node-pty load native code and spawn real files: keep every
# dependency outside the asar archive. Electron redirects app.asar paths
# to app.asar.unpacked for require and fs automatically.
asarUnpack:
  - node_modules/**/*
  # agent-core runs under ELECTRON_RUN_AS_NODE, which cannot read inside
  # the archive. Spawn it from app.asar.unpacked.
  - dist-electron/agent-core.mjs
extraResources:
  - from: resources/termina-core
    to: termina-core
  - from: resources/node
    to: node
  - from: resources/bin
    to: bin
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Signing identity: the keychain when building locally, or CSC_NAME /
  # CSC_LINK on CI. Without any identity the build stays unsigned.
linux:
  target: AppImage
  category: Development
  icon: build/icon.png
npmRebuild: false
electronLanguages:
  - en
# Multi-job publishes must all target the same release type; a draft
# publish skips when a release already exists.
publish:
  provider: github
  owner: Jesusz0r
  repo: termina
  releaseType: release
