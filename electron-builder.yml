appId: dev.termina.app
productName: Termina
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
# pi and node-pty load native code and spawn real files: keep every
# dependency outside the asar archive. Electron redirects app.asar paths
# to app.asar.unpacked for require and fs automatically.
asarUnpack:
  - node_modules/**/*
extraResources:
  - from: resources/termina-core
    to: termina-core
  - from: resources/node
    to: node
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Signing identity: the keychain when building locally, or CSC_NAME /
  # CSC_LINK on CI. Without any identity the build stays unsigned.
win:
  target: nsis
  icon: build/icon.png
linux:
  target: AppImage
  category: Development
  icon: build/icon.png
npmRebuild: false
electronLanguages:
  - en
