<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>Pi/ditor</title>
    <style>
      /* Critical first-paint styles: prevents the unstyled flash before
         vite injects the real stylesheet. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      #splash .logo {
        color: #d4d4d4;
      }
      #splash .logo-text {
        font-size: 26px;
        font-weight: 300;
        letter-spacing: 0.04em;
      }
      #splash .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4fc1ff;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      #splash .hint {
        font-size: 12px;
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 800 800" width="72" height="72" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M165.29 165.29 H517.36 V400 H400 V517.36 H282.65 V634.72 H165.29 Z M282.65 282.65 V400 H400 V282.65 Z"/>
        <path fill="currentColor" d="M517.36 400 H634.72 V634.72 H517.36 Z"/>
      </svg>
      <div class="logo-text">Pi/ditor</div>
      <div class="pulse"></div>
      <div class="hint">starting pi…</div>
    </div>
    <div id="app">
      <main id="main">
        <div id="explorer">
          <div class="explorer-header">
            <svg class="header-logo" viewBox="0 0 800 800" width="12" height="12" aria-hidden="true">
              <path fill="currentColor" fill-rule="evenodd" d="M165.29 165.29 H517.36 V400 H400 V517.36 H282.65 V634.72 H165.29 Z M282.65 282.65 V400 H400 V282.65 Z"/>
              <path fill="currentColor" d="M517.36 400 H634.72 V634.72 H517.36 Z"/>
            </svg>
            <span>Explorer</span>
            <div class="explorer-header-actions">
              <button id="btn-settings" class="header-action" title="Open settings" aria-label="Open settings">⚙</button>
            </div>
          </div>
          <div id="explorer-tree"></div>
        </div>
        <div id="explorer-divider" title="Drag to resize"></div>
        <div id="main-split">
          <section id="left-pane">
            <div id="terminal-tabs">
              <div id="terminal-tabs-list"></div>
              <button id="btn-new-terminal" title="New terminal (Cmd+Shift+T)">＋</button>
            </div>
            <div id="terminal-container"></div>
            <div id="timeline-strip">
              <div class="timeline-header">
                <span class="timeline-label">⏱ Timeline</span>
                <span id="timeline-count" class="muted"></span>
                <span id="timeline-recorder" class="timeline-recorder" hidden></span>
                <div class="spacer"></div>
                <button id="btn-fork-run" title="Fork the last completed run into two isolated candidates" hidden>⇉ Fork Run</button>
                <button id="btn-timeline-play" title="Replay this run" hidden>▶</button>
              </div>
              <div id="timeline-dots"></div>
            </div>
            <section id="plan-panel" class="collapsed">
              <div class="panel-header">
                <span>Plan</span>
                <span id="plan-count" class="muted"></span>
                <div class="spacer"></div>
                <button id="btn-dispatch" title="Dispatch the plan tasks to parallel agents" hidden>⇉</button>
              </div>
              <ul id="plan-list"></ul>
            </section>
            <section id="worldline-panel" class="collapsed">
              <div class="panel-header">
                <span>Worldlines</span>
                <span id="worldline-count" class="muted"></span>
                <div class="spacer"></div>
              </div>
              <div id="worldline-list"></div>
            </section>
            <div id="modified-panel" class="collapsed">
              <div class="panel-header">
                <span>Modified files</span>
                <span id="modified-count" class="muted"></span>
                <div class="spacer"></div>
                <button id="btn-accept-all" title="Mark every modified file as accepted">Accept all</button>
                <button id="btn-clear-modified" title="Clear the list">Clear</button>
              </div>
              <ul id="modified-list"></ul>
            </div>
          </section>

          <div id="divider" title="Drag to resize"></div>

          <section id="right-pane">
            <div id="editor-tabs"></div>
            <div id="editor-container"></div>
            <div id="review-container" style="display:none">
              <div class="review-header">
                <button id="review-back" class="review-btn" title="Back to the editor">←</button>
                <span id="review-filename" class="review-filename"></span>
                <span id="review-hint" class="muted"></span>
                <div class="spacer"></div>
                <button id="review-open" class="review-btn" title="Open the current file as a tab">Open file</button>
                <button id="review-accept" class="review-btn primary" title="Mark this change as accepted">Accept</button>
                <button id="review-revert" class="review-btn danger" title="Restore the pre-run version">Revert</button>
              </div>
              <div id="review-diff"></div>
            </div>
            <div id="editor-empty">
              <svg class="empty-logo" viewBox="0 0 800 800" width="56" height="56" aria-hidden="true">
                <path fill="currentColor" fill-rule="evenodd" d="M165.29 165.29 H517.36 V400 H400 V517.36 H282.65 V634.72 H165.29 Z M282.65 282.65 V400 H400 V282.65 Z"/>
                <path fill="currentColor" d="M517.36 400 H634.72 V634.72 H517.36 Z"/>
              </svg>
              <div class="empty-title">Pi/ditor</div>
              <div class="empty-sub">
                Open a project folder, then run <b>pi</b> in the terminal.
                <br />
                Files the agent writes or edits will appear here <b>live</b>.
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer id="statusbar">
        <span id="status-cwd" class="muted"></span>
        <button id="btn-verify" class="statusbar-verify" disabled title="Run the detected tests and feed the result to the agent">✓ Verify</button>
        <span id="verify-badge" class="muted" hidden></span>
        <div class="spacer"></div>
        <span id="status-state" class="muted">idle</span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
