<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>pi-editor</title>
  </head>
  <body>
    <div id="app">
      <main id="main">
        <div id="explorer">
          <div class="explorer-header">
            <span>Explorer</span>
          </div>
          <div id="explorer-tree"></div>
        </div>
        <div id="explorer-divider" title="Drag to resize"></div>
        <div id="main-split">
          <section id="left-pane">
            <div id="terminal-tabs">
              <div id="terminal-tabs-list"></div>
              <button id="btn-new-terminal" class="toolbar-btn" title="New terminal (Cmd+Shift+T)">＋</button>
            </div>
            <div id="terminal-container"></div>
            <div id="modified-panel" class="collapsed">
              <div class="panel-header">
                <span>Modified files</span>
                <span id="modified-count" class="muted"></span>
                <div class="spacer"></div>
                <button id="btn-clear-modified" class="mini-btn" title="Clear the list">clear</button>
              </div>
              <ul id="modified-list"></ul>
            </div>
          </section>

          <div id="divider" title="Drag to resize"></div>

          <section id="right-pane">
            <div id="editor-tabs"></div>
            <div id="editor-container"></div>
            <div id="editor-empty">
              <div class="empty-title">pi-editor</div>
              <div class="empty-sub">
                Open a project folder, then run <b>pi</b> in the terminal.
                <br />
                Files the agent writes or edits will appear here <b>live</b>.
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer id="statusbar">
        <span id="status-state" class="muted">idle</span>
        <div class="spacer"></div>
        <span id="status-cwd" class="muted"></span>
        <button id="btn-abort" class="statusbar-abort" disabled title="Send Ctrl+C to the active terminal (Cmd+.)">■ Abort</button>
      </footer>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
