<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws: http://localhost:*; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Termina</title>
    <style>
      /* Critical first-paint styles: prevents the unstyled flash before
         vite injects the real stylesheet. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0d09;
        color: #edf2e2;
        font-family: "Departure Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      #splash .brand-mark {
        width: 72px;
        height: 72px;
        color: #b8f04a;
      }
      #splash .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b8f04a;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      #splash .hint {
        font-size: 12px;
        color: #9aa78c;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="brand-mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><line x1="180" y1="636" x2="650" y2="636" stroke="currentColor" stroke-opacity="0.35" stroke-width="56" stroke-linecap="round"/><circle cx="250" cy="636" r="54" fill="currentColor"/><circle cx="410" cy="636" r="54" fill="currentColor"/><circle cx="568" cy="636" r="70" fill="currentColor"/><path d="M568 636Q612 566 692 506" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/><circle cx="800" cy="420" r="62" fill="none" stroke="currentColor" stroke-width="50"/></svg>
      <div class="pulse"></div>
      <div class="hint">starting…</div>
    </div>
    <div id="app">
      <header id="project-bar">
        <div id="project-tabs"></div>
        <button type="button" id="btn-new-project" title="Open a project in a new tab" aria-label="New project">＋<span class="newtab-label">New project</span></button>
      </header>
      <main id="main">
        <div id="explorer">
          <div class="explorer-header">
            <svg class="header-logo brand-mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><line x1="180" y1="636" x2="650" y2="636" stroke="currentColor" stroke-opacity="0.35" stroke-width="56" stroke-linecap="round"/><circle cx="250" cy="636" r="54" fill="currentColor"/><circle cx="410" cy="636" r="54" fill="currentColor"/><circle cx="568" cy="636" r="70" fill="currentColor"/><path d="M568 636Q612 566 692 506" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/><circle cx="800" cy="420" r="62" fill="none" stroke="currentColor" stroke-width="50"/></svg>
            <span>Explorer</span>
            <button type="button" id="btn-min-explorer" class="pane-toggle" title="Minimize explorer" aria-label="Minimize explorer">–</button>
          </div>
          <div class="explorer-filter">
            <input type="text" id="explorer-filter-input" class="explorer-filter-input"
                   placeholder="Filter files" aria-label="Filter files in the explorer"
                   autocomplete="off" spellcheck="false" />
          </div>
          <div class="explorer-content" id="explorer-content" hidden>
            <div class="explorer-content-header">
              <span id="explorer-content-title" class="explorer-content-title">Content results</span>
              <button type="button" id="explorer-content-rerun" class="explorer-content-btn action-btn" title="Re-run search" aria-label="Re-run content search">↻<span class="action-label">Re-run</span></button>
              <button type="button" id="explorer-content-clear" class="explorer-content-btn" title="Clear results" aria-label="Clear content results">×</button>
            </div>
            <div id="explorer-content-results"></div>
          </div>
          <div id="explorer-tree"></div>
        </div>
        <div id="explorer-divider" title="Drag to resize"></div>
        <div id="main-split">
          <section id="left-pane">
            <div id="terminal-tabs">
              <div id="terminal-tabs-list"></div>
              <button type="button" id="btn-new-terminal" title="New terminal (Cmd+T / Ctrl+T)" aria-label="New terminal">＋<span class="newtab-label">New terminal</span></button>
              <button type="button" id="btn-min-terminal" class="pane-toggle" title="Minimize terminal" aria-label="Minimize terminal">–</button>
            </div>
            <div id="terminal-container"></div>
            <div id="activity-tabbar" role="tablist" aria-label="Activity panels">
              <button type="button" class="activity-tab" id="activity-tab-timeline" data-tab="timeline" role="tab" aria-controls="timeline-strip">Timeline <span class="activity-count" data-count="timeline"></span></button>
              <button type="button" class="activity-tab" id="activity-tab-plan" data-tab="plan" role="tab" aria-controls="plan-panel">Plan <span class="activity-count" data-count="plan"></span></button>
              <button type="button" class="activity-tab" id="activity-tab-worldlines" data-tab="worldlines" role="tab" aria-controls="worldline-panel">Worldlines <span class="activity-count" data-count="worldlines"></span></button>
              <button type="button" class="activity-tab" id="activity-tab-modified" data-tab="modified" role="tab" aria-controls="modified-panel">Modified <span class="activity-count" data-count="modified"></span></button>
            </div>
            <div id="timeline-strip" class="tab-active" role="tabpanel" aria-labelledby="activity-tab-timeline">
              <div class="timeline-header">
                <span class="activity-panel-title">Timeline</span>
                <span id="timeline-count" class="muted"></span>
                <span id="timeline-prefix" class="muted" hidden></span>
                <span id="timeline-recorder" class="timeline-recorder" hidden></span>
                <div class="spacer"></div>
                <button type="button" id="btn-fork-run" class="action-btn" title="Fork the last completed run into two isolated candidates" hidden>⇉<span class="action-label">Fork Run</span></button>
                <button type="button" id="btn-timeline-play" class="action-btn" title="Replay this run" aria-label="Replay this run" hidden>▶</button>
              </div>
              <div id="timeline-dots"></div>
              <p class="activity-empty muted" data-empty hidden>Dots appear when this terminal runs.</p>
            </div>
            <section id="plan-panel" class="collapsed" role="tabpanel" aria-labelledby="activity-tab-plan">
              <div class="panel-header">
                <span class="activity-panel-title">Plan</span>
                <span id="plan-count" class="muted"></span>
                <div class="spacer"></div>
                <button type="button" id="btn-dispatch" class="action-btn" title="Dispatch the plan tasks to parallel agents" aria-label="Dispatch" hidden>⇉<span class="action-label">Dispatch</span></button>
              </div>
              <ul id="plan-list"></ul>
              <p class="activity-empty muted" data-empty hidden>Ask the agent for a plan.</p>
            </section>
            <section id="worldline-panel" class="collapsed" role="tabpanel" aria-labelledby="activity-tab-worldlines">
              <div class="panel-header">
                <span class="activity-panel-title">Worldlines</span>
                <span id="worldline-count" class="muted"></span>
                <span id="worldline-summary" class="muted"></span>
                <div class="spacer"></div>
              </div>
              <div id="worldline-list"></div>
              <p class="activity-empty muted" data-empty hidden>Fork a completed run to compare two approaches.</p>
            </section>
            <div id="modified-panel" class="collapsed" role="tabpanel" aria-labelledby="activity-tab-modified">
              <div id="modified-resize" title="Drag to resize"></div>
              <div class="panel-header">
                <span class="activity-panel-title">Modified files</span>
                <span id="modified-count" class="muted"></span>
                <div class="spacer"></div>
                <button type="button" id="btn-accept-all" title="Mark every modified file as accepted">Accept all</button>
                <button type="button" id="btn-clear-modified" title="Clear the list">Clear</button>
              </div>
              <ul id="modified-list"></ul>
              <p class="activity-empty muted" data-empty hidden>Files this run changes land here.</p>
            </div>
          </section>

          <div id="divider" title="Drag to resize"></div>

          <section id="right-pane">
            <div id="editor-chrome" class="pane-chrome">
              <div id="editor-tabs"></div>
              <button type="button" id="btn-min-editor" class="pane-toggle" title="Minimize editor" aria-label="Minimize editor">–</button>
            </div>
            <div id="editor-container"></div>
            <div id="review-container" style="display:none">
              <div class="review-header">
                <button type="button" id="review-back" class="review-btn" title="Back to the editor">←</button>
                <span id="review-filename" class="review-filename"></span>
                <span id="review-hint" class="muted"></span>
                <div class="spacer"></div>
                <button type="button" id="review-open" class="review-btn" title="Open the current file as a tab">Open file</button>
                <button type="button" id="review-accept" class="review-btn primary" title="Mark this change as accepted">Accept</button>
                <button type="button" id="review-revert" class="review-btn danger" title="Restore the pre-run version">Revert</button>
              </div>
              <div id="review-diff"></div>
            </div>
            <template id="editor-empty-template">
              <div class="editor-empty">
                <svg class="empty-logo brand-mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false"><line x1="180" y1="636" x2="650" y2="636" stroke="currentColor" stroke-opacity="0.35" stroke-width="56" stroke-linecap="round"/><circle cx="250" cy="636" r="54" fill="currentColor"/><circle cx="410" cy="636" r="54" fill="currentColor"/><circle cx="568" cy="636" r="70" fill="currentColor"/><path d="M568 636Q612 566 692 506" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round"/><circle cx="800" cy="420" r="62" fill="none" stroke="currentColor" stroke-width="50"/></svg>
                <div class="empty-title">Termina</div>
                <div class="empty-sub empty-welcome">
                  Open a folder to start — the agent edits live beside its terminal.
                  <div class="empty-hints">
                    <span><kbd>⌘</kbd><kbd>O</kbd> open folder</span>
                    <span><kbd>@</kbd> attach file</span>
                    <span><kbd>/</kbd> commands</span>
                    <span><kbd>^J</kbd> newline</span>
                  </div>
                </div>
                <div class="empty-sub empty-login" hidden>
                  In the terminal: <kbd>/login</kbd> then <kbd>/models</kbd> to pick a model.
                </div>
                <button type="button" class="empty-open-folder">Open folder</button>
                <div class="empty-foot muted">Drop files onto the terminal to attach them · Drag the divider to resize panes</div>
              </div>
            </template>
          </section>
        </div>
      </main>

      <footer id="statusbar">
        <span id="status-cwd" class="muted"></span>
        <button type="button" id="btn-verify" class="statusbar-verify" disabled title="Run the detected tests and feed the result to the agent">Verify</button>
        <span id="verify-badge" class="muted" hidden></span>
        <button type="button" id="btn-copy-subject" class="statusbar-handoff" hidden title="Copy a commit subject from the last run. Termina does not write Git.">Copy commit subject</button>
        <button type="button" id="btn-open-shell" class="statusbar-handoff" hidden title="Focus a shell in this project">Open shell</button>
        <div class="spacer"></div>
        <button type="button" id="btn-app-update" hidden title="Update Termina" aria-label="Update Termina">↑</button>
        <span id="status-state" class="muted">idle</span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
